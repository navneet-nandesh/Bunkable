<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bunkable | College Portal</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d4ff2a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">

    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Outfit:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="container">
        <!-- Login Section -->
        <section id="login-section" class="glass-panel active">
            <div class="logo"
                style="display: flex; justify-content: center; align-items: center; gap: 12px; margin-bottom: 2rem;">
                <img src="icon.png" alt="Bunkable Icon" width="60" height="60" style="object-fit: contain;">
                <h1
                    style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 3.5rem; font-weight: 700; letter-spacing: -0.05em; color: var(--text-main); margin: 0;">
                    Bunkable</h1>
            </div>

            <form id="login-form">
                <div class="input-group">
                    <label for="student-id">Student ID</label>
                    <input type="text" id="student-id" placeholder="99925" required>
                </div>
                <div class="input-group">
                    <label for="password">Portal Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <div class="remember-me" style="display: flex; align-items: center; justify-content: flex-start; gap: 10px; margin-top: -5px; margin-bottom: 25px;">
                    <input type="checkbox" id="remember-me" checked style="width: 18px; height: 18px; padding: 0; margin: 0; accent-color: var(--primary); cursor: pointer;">
                    <label for="remember-me" style="display: inline-block; color: var(--text-muted); font-weight: 500; font-size: 0.95rem; margin-bottom: 0; cursor: pointer;">Remember me for auto-login</label>
                </div>
                <button type="submit" class="btn-primary" id="login-btn">
                    <span class="btn-text">Connect to FISAT Portal</span>
                    <div class="spinner hidden"></div>
                </button>
                <div id="login-error" class="hidden"
                    style="color: var(--danger); text-align: center; margin-top: 1rem; font-size: 0.95rem; font-weight: 500;">
                </div>
            </form>
        </section>

        <!-- Dashboard Section -->
        <section id="dashboard-section" class="glass-panel hidden">
            <header class="dashboard-header">
                <div>
                    <h2>Welcome back, <span id="user-name">Student</span>!</h2>
                    <p class="subtitle">Here is your live attendance analysis.</p>
                </div>
                <div class="target-controls">
                    <label for="target-attendance">Target Attendance %</label>
                    <div class="target-input-wrapper">
                        <input type="number" id="target-attendance" value="75" min="50" max="100">
                        <span class="percent-symbol">%</span>
                    </div>
                </div>
            </header>

            <div id="timetable-section" class="timetable-card glass-panel" style="padding: 1.5rem; margin-bottom: 2rem;">
                <div class="timetable-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <h3 style="font-size: 1.2rem; font-weight: 600; color: var(--text-main); margin: 0;">Today's Classes</h3>
                        <button id="edit-timetable-btn" class="btn-secondary" style="padding: 4px 10px; font-size: 0.75rem; margin: 0; display: none;">Edit Labs/Classes</button>
                    </div>
                    <span id="current-day" style="color: var(--primary); font-weight: 600;">Monday</span>
                </div>
                <div id="timetable-content">
                    <div class="loading-timetable" style="text-align: center; color: var(--text-muted);">Checking cloud database...</div>
                </div>
            </div>

            <div class="stats-overview">
                <div class="stat-card">
                    <h3>Overall Attendance</h3>
                    <div class="stat-value" id="overall-percentage">0%</div>
                </div>
                <div class="stat-card">
                    <h3>Total Classes</h3>
                    <div class="stat-value" id="overall-total">0</div>
                </div>
                <div class="stat-card">
                    <h3>Classes Attended</h3>
                    <div class="stat-value" id="overall-attended">0</div>
                </div>
            </div>

            <div class="subjects-grid" id="subjects-grid">
                <!-- Subject cards will be injected here via JS -->
            </div>

            <button id="logout-btn" class="btn-secondary">Log Out</button>
        </section>
    </main>

    <!-- Timetable Builder Modal -->
    <div id="timetable-modal" class="modal-overlay hidden">
        <div class="modal-content glass-panel" style="padding: 2rem;">
            <h2 style="margin-bottom: 5px;">Build Class Timetable</h2>
            <p class="subtitle" style="margin-bottom: 1.5rem;">Set up the weekly schedule for everyone in your batch.</p>
            
            <div style="background: rgba(204,255,0,0.1); border: 1px solid rgba(204,255,0,0.3); border-radius: 12px; padding: 15px; margin-bottom: 15px; text-align: center;">
                <p style="color: var(--primary); font-weight: 600; margin-bottom: 10px;">✨ Magic AI Import</p>
                <input type="file" id="ai-timetable-upload" accept="image/*" style="display: none;">
                <button id="ai-upload-btn" class="btn-secondary" style="margin-top: 0; border-color: var(--primary); color: var(--text-main);">Upload Timetable Photo</button>
            </div>

            <div id="timetable-builder" style="display: flex; flex-direction: column; gap: 10px; max-height: 50vh; overflow-y: auto; padding-right: 10px;">
                <!-- Builder UI injected by JS -->
            </div>
            <div style="display: flex; gap: 10px; margin-top: 1.5rem;">
                <button id="cancel-timetable" class="btn-secondary" style="margin-top: 0; padding: 0.8rem; flex: 1;">Cancel</button>
                <button id="save-local-timetable" class="btn-primary" style="margin-top: 0; padding: 0.8rem; flex: 1;">Save (Just me)</button>
                <button id="save-timetable" class="btn-secondary" style="margin-top: 0; padding: 0.8rem; font-size: 0.85rem; flex: 1; border-color: var(--primary);">Publish to Cloud</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registered!'))
                    .catch(err => console.error('Service Worker registration failed: ', err));
            });
        }
    </script>
</body>

</html>
